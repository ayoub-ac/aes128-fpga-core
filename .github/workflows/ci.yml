name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # OSS CAD Suite build used for the numbers in README.md and SYNTH_REPORT.md.
  OSS_CAD_SUITE_DATE: "2026-11-01"

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: lint, test, test-secure, vhdl-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/oss-cad-suite
        with:
          date: ${{ env.OSS_CAD_SUITE_DATE }}
      - name: make lint
        run: source "$OSS_CAD_SUITE/environment" && make lint
      - name: make test
        run: source "$OSS_CAD_SUITE/environment" && make test
      - name: make test-secure
        run: source "$OSS_CAD_SUITE/environment" && make test-secure
      - name: make vhdl-test
        run: source "$OSS_CAD_SUITE/environment" && make vhdl-test

  vectors:
    name: test-vectors, waves
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/oss-cad-suite
        with:
          date: ${{ env.OSS_CAD_SUITE_DATE }}
      - name: Install Python packages
        run: |
          source "$OSS_CAD_SUITE/environment"
          python3 -m pip install cryptography==46.0.5 matplotlib==3.11.2 vcdvcd==2.6.0
      - name: make test-vectors
        run: source "$OSS_CAD_SUITE/environment" && make test-vectors
      - name: make waves
        run: source "$OSS_CAD_SUITE/environment" && make waves
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: waves
          path: build/waves/*.png
          if-no-files-found: ignore

  synth:
    name: synth_report reproduces SYNTH_REPORT.md
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/oss-cad-suite
        with:
          date: ${{ env.OSS_CAD_SUITE_DATE }}
      - name: make synth_report
        run: source "$OSS_CAD_SUITE/environment" && make synth_report
      - name: Compare with the committed report
        run: git diff --exit-code SYNTH_REPORT.md
